name: Publish TypeScript SDK

# Callable only, deliberately. npm permits one trusted-publisher filename per
# package and resolves the calling workflow, so that filename has to be
# semantic-release.yml - which leaves this file unable to authenticate a
# publish when triggered directly. A workflow_dispatch here would present a
# working button that always fails ENEEDAUTH. Manual republishes go through
# `Semantic Release` with the publish_npm input instead.
on:
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit to build and publish. The release workflow passes the exact
          commit carrying the version bump; empty means the triggering ref.
        type: string
        required: false
        default: ''

# Required by npm's trusted publishing, and required on *both* this workflow
# and any workflow that calls it - npm mints the OIDC token in whichever job
# runs `npm publish`, but the calling job has to be allowed to hand the
# permission down.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          ref: ${{ inputs.ref }}
      # Node 22.14+ and npm 11.5.1+ are the floor for trusted publishing. Node
      # 22 satisfies the runtime half but still ships npm 10.x, so npm is
      # upgraded explicitly rather than being taken on trust from the image.
      # Deliberately no `registry-url`: it makes setup-node write an .npmrc
      # containing `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`. With
      # no token in the environment that line still counts as configured auth,
      # so npm skips the OIDC exchange and the publish 404s. registry.npmjs.org
      # is the default registry anyway.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install -g npm@^11.5.1
      - name: Confirm npm is new enough to mint an OIDC token
        run: |
          version="$(npm --version)"
          echo "npm $version"
          # Fail here with a legible message rather than at `npm publish` with
          # an auth error that looks like a misconfigured trusted publisher.
          if [ "$(printf '%s\n11.5.1\n' "$version" | sort -V | head -1)" != "11.5.1" ]; then
            echo "npm $version is older than the 11.5.1 required for trusted publishing" >&2
            exit 1
          fi
      - run: npm ci
        working-directory: packages/typescript
      - run: npm run build
        working-directory: packages/typescript
      # No NODE_AUTH_TOKEN: authentication is the OIDC exchange, so there is no
      # token to expire and no 2FA-bypass requirement to satisfy.
      - run: npm publish --access public
        working-directory: packages/typescript
