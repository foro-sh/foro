name: Publish Python SDK

# Manual and recovery publishes only - the automatic publish on merge is a job
# in semantic-release.yml, which duplicates these steps rather than calling
# this file. PyPI's trusted publishing cannot authorize an upload that runs
# inside a reusable workflow ("Reusable workflows cannot currently be used as
# the workflow in a Trusted Publisher"), so `workflow_call` is not an option
# here and the duplication is deliberate.
#
# Keep both trusted publishers configured on PyPI - semantic-release.yml for
# the automatic path, this file for the manual one. Dispatching builds the
# branch head, which after a release is the commit carrying the version bump.
on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv build
        working-directory: packages/python
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: packages/python/dist/
