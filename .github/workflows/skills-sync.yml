name: Skills Sync

# The Claude Code, Codex and Cursor plugins ship the same skills. A symlink
# would be cheaper, but each client's manifest requires paths to stay inside
# the plugin root, so the trees hold real files and this job keeps them honest.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  diff:
    name: Plugin skills are identical
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare skill trees
        run: |
          status=0
          canonical=plugins/claude-code/skills
          for dest in plugins/codex/skills plugins/cursor/skills; do
            diff -r "$canonical" "$dest" || {
              echo "::error::Plugin skills have drifted. $canonical is canonical - resync with:"
              echo "::error::  rm -rf $dest && cp -R $canonical $dest"
              status=1
            }
          done
          exit $status
