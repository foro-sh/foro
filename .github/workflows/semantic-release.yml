name: Release

on:
  push:
    branches: [main]
  # npm allows exactly one trusted-publisher workflow filename per package,
  # and it resolves the *calling* workflow - so this file is the only one that
  # can ever authenticate an npm publish. Manual recovery therefore has to be
  # dispatched from here rather than from publish-typescript.yml, which cannot
  # authenticate on its own no matter how it is triggered.
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Republish the npm package from this ref, without cutting a release.
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Opens or updates the Release PR on an ordinary push. When that PR is
  # merged, this run creates the tag and GitHub release; tests and publish
  # jobs below then fire. Skipped on a dispatch so recovery can republish
  # without proposing a new version.
  release-please:
    name: Release Please
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # GitHub-hosted: the action is a Node 24 JavaScript action, and ubuntu-latest
    # is what GitHub documents it against. The job only talks to the API.
    runs-on: ubuntu-latest
    outputs:
      # Manifest mode sometimes leaves the root `release_created` unset and
      # only sets `releases_created`. Downstream jobs key off this output.
      release_created: ${{ steps.release.outputs.releases_created }}
      sha: ${{ steps.release.outputs.sha || steps.release.outputs['.--sha'] }}
    steps:
      - name: Mint a release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # GITHUB_TOKEN cannot push past main's branch protection, and would not
      # retrigger Tests on the Release PR. The app token does both.
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The publish gate. tests.yml has no `push` trigger of its own precisely so
  # that this is the run that decides - a separate workflow triggered by the
  # same push reports independently and cannot block anything.
  #
  # Feature PRs and the Release PR already ran this suite; this is the last
  # check before an upload, on the exact tagged commit.
  tests:
    name: Tests
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  # The release commit always rewrites both manifests, so measuring HEAD
  # would mark every package as changed on every release. HEAD is the tagged
  # commit; HEAD^ is main before it. The previous tag is the newest one
  # reachable from that parent.
  changed:
    name: Detect changed packages
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    outputs:
      python: ${{ steps.changed.outputs.python }}
      typescript: ${{ steps.changed.outputs.typescript }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Detect changed packages
        id: changed
        run: |
          empty_tree="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
          base="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "$empty_tree")"

          files="$(git diff --name-only "$base" HEAD^)"
          echo "comparing ${base}..HEAD^"
          echo "$files"

          for package in python typescript; do
            if printf '%s\n' "$files" | grep -q "^packages/${package}/"; then
              echo "${package}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${package}=false" >> "$GITHUB_OUTPUT"
            fi
          done

  # These steps duplicate publish-python.yml rather than calling it. PyPI's
  # trusted publishing cannot authorize an upload that runs inside a reusable
  # workflow, so `uses:` is not available here - the upload has to sit in the
  # workflow that PyPI is configured to trust. publish-python.yml stays as the
  # manual recovery path; both files need a trusted publisher on PyPI.
  publish-python:
    name: Publish Python SDK
    needs: [release-please, tests, changed]
    if: >-
      needs.release-please.result == 'success'
      && needs.release-please.outputs.release_created == 'true'
      && needs.tests.result == 'success'
      && needs.changed.outputs.python == 'true'
    # GitHub-hosted deliberately, not a Blacksmith runner: pypa's publish
    # action is a container action with an amd64-only image, so an arm64
    # runner fails with `exec /app/twine-upload.sh: exec format error`.
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build
        working-directory: packages/python
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: packages/python/dist/

  # npm's trusted publishing resolves the *calling* workflow's filename, not
  # the one holding the publish step - the opposite of PyPI - and npm allows
  # only one such filename per package. So every npm publish, automatic or
  # manual, has to be called from this file for the publisher to match.
  #
  # Two ways in, hence the two-armed condition:
  #   - a release was cut and it touched packages/typescript
  #   - someone dispatched this workflow with publish_npm (recovery, e.g. the
  #     release succeeded but the upload failed)
  #
  # `always()` is needed because the release-please job is skipped entirely
  # on a dispatch, and a skipped dependency would otherwise skip this job
  # too. needs.tests.result is checked on the automatic arm so a red suite
  # still blocks the upload.
  #
  # id-token: write has to be granted here as well as in the called workflow.
  publish-typescript:
    name: Publish TypeScript SDK
    needs: [release-please, tests, changed]
    if: >-
      always() && (
        (needs.release-please.result == 'success'
          && needs.release-please.outputs.release_created == 'true'
          && needs.tests.result == 'success'
          && needs.changed.outputs.typescript == 'true')
        || (github.event_name == 'workflow_dispatch' && inputs.publish_npm)
      )
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-typescript.yml
    with:
      # Empty on a dispatch, which makes the called workflow check out the
      # dispatched ref - main's head, already carrying the version bump.
      ref: ${{ needs.release-please.outputs.sha }}
    secrets: inherit
