name: Semantic Release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@1a4442caab129478691018c6a5a7f419307c0bfd # v4.0.3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

      - name: Lint pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            npx commitlint --from "HEAD~1" --to "HEAD" --verbose
          else
            npx commitlint --from "$BEFORE" --to "$AFTER" --verbose
          fi

  release:
    name: Release
    needs: commitlint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@1a4442caab129478691018c6a5a7f419307c0bfd # v4.0.3
        with:
          node-version: 20

      - uses: astral-sh/setup-uv@a6e6e4e11010466bdf092cc690f215a148601211 # v4.0.0

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Build
        run: npm run build

      - name: Release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Update Python version
        if: steps.semantic-release.outputs.new-release-published == 'true'
        run: |
          VERSION="${{ steps.semantic-release.outputs.new-release-version }}"
          sed -i "s/version = \"[^\"]*\"/version = \"${VERSION}\"/" packages/python/pyproject.toml

      - name: Commit version updates
        if: steps.semantic-release.outputs.new-release-published == 'true'
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add packages/python/pyproject.toml
          git commit -m "chore: sync version to ${{ steps.semantic-release.outputs.new-release-version }}" || true
          git push
