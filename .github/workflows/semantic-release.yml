name: Semantic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: npm ci

      - name: Install semantic-release
        run: npm install --save-dev semantic-release @semantic-release/changelog @semantic-release/git @semantic-release/exec

      - name: Run semantic-release
        uses: cycjimmy/semantic-release-action@v4
        with:
          working_directory: ./
          dry_run: false
          branches: |
            [
              '+([0-9])?(.{+([0-9]),x}).x',
              'main',
              'next',
              'next-major',
              {name: 'beta', prerelease: true},
              {name: 'alpha', prerelease: true}
            ]
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Python version
        if: steps.semantic-release.outputs.new-release-published == 'true'
        run: |
          VERSION="${{ steps.semantic-release.outputs.new-release-version }}"
          sed -i "s/version = \"[^\"]*\"/version = \"${VERSION}\"/" packages/python/pyproject.toml

      - name: Commit version updates
        if: steps.semantic-release.outputs.new-release-published == 'true'
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add packages/python/pyproject.toml
          git commit -m "chore: sync version to ${{ steps.semantic-release.outputs.new-release-version }}" || true
          git push
