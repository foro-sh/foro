name: Stamp Release PR

# release-please owns CHANGELOG.md and the manifest, but not the SDK
# lockfiles. Extra-filing package.json would desync package-lock.json and
# fail `npm ci` on the Release PR; this job is the one place set-version.sh
# runs, so the bumped manifests and lockfiles land on the PR before merge
# and therefore inside the tag.
#
# Triggered by the GitHub App token, not GITHUB_TOKEN, so the push retriggers
# Tests on the stamped commit. GITHUB_TOKEN would silently skip that run.

on:
  push:
    branches: ["release-please--branches--**"]

concurrency:
  group: stamp-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  stamp:
    name: Stamp manifests and lockfiles
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: stamp ') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - name: Mint a release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Stamp version from the release-please manifest
        run: |
          version="$(python3 -c 'import json, pathlib; print(json.loads(pathlib.Path(".release-please-manifest.json").read_text())["."])')"
          ./scripts/set-version.sh "$version"

      - name: Commit if the stamp changed anything
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          version="$(python3 -c 'import json, pathlib; print(json.loads(pathlib.Path(".release-please-manifest.json").read_text())["."])')"
          git add \
            packages/python/pyproject.toml \
            packages/python/uv.lock \
            packages/python/tests/fixtures/minimal-fastmcp/uv.lock \
            packages/typescript/package.json \
            packages/typescript/package-lock.json
          if git diff --cached --quiet; then
            echo "already stamped to $version"
            exit 0
          fi
          git commit -m "chore: stamp ${version} manifests and lockfiles"
          # release-please force-pushes this branch when more commits land.
          # A rejected push is noisy but harmless: that push retriggers this job.
          git push
