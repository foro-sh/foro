name: Tests

# Until this existed, nothing ran the test suites - the only PR checks were
# commitlint and the plugin-skills diff, so a release could publish to PyPI
# and npm with every test red and no signal anywhere.
#
# Two ways in, and deliberately not three:
#   - `pull_request`, as an ordinary PR check
#   - `workflow_call`, from semantic-release.yml, where the release job
#     `needs:` it - that is what actually blocks a publish on red tests
#
# There is no `push: branches: [main]` trigger. Running on the push *and*
# being called by the release workflow on the same push would run both suites
# twice per merge, and only one of those runs would have any power to stop the
# release. The `workflow_call` arm is the one with the power, so it is the one
# main gets.
on:
  pull_request:
  workflow_call:

# A superseded PR run tells us nothing, so cancel it. Release-gating runs are
# left alone: cancelling one would hide the failure that should have stopped
# the publish. `github.event_name` is the *caller's* event under
# workflow_call, so a merge to main reads as `push` here and is not cancelled.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The suite starts real servers and waits on ports, so a hang is a
    # plausible failure mode. Fail in minutes rather than burning the
    # six-hour default.
    timeout-minutes: 15
    strategy:
      # One version's failure is not a reason to lose the others' results -
      # knowing whether a break is version-specific is the whole point of
      # running a matrix.
      fail-fast: false
      matrix:
        # The floor and the ceiling of `requires-python`. Testing only 3.12
        # is how `BaseExceptionGroup` (a builtin from 3.11) shipped as a
        # NameError on every 3.10 handshake failure, with two tests in
        # test_verify.py that would have caught it on the first run.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false

      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@d8db0a86d3d88f3017a4e6b8a1e2b234e7a0a1b5 # v4.0.0

      # `foro check` rejects a repo whose uv.lock has drifted from its
      # pyproject.toml, so this SDK should hold itself to it. --frozen also
      # keeps the run honest: without it uv would quietly relock and the
      # tests would pass against dependencies nobody committed.
      - name: Install locked dependencies
        # UV_PYTHON pins uv to the matrix interpreter. Without it uv picks its
        # own (anything satisfying requires-python, or one it downloads), and
        # the matrix would silently test the same version three times.
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv sync --frozen --dev
        working-directory: packages/python

      # git init runs during scaffolding tests, and git refuses to work
      # without an identity on some runner images.
      - name: Configure git identity for scaffolding tests
        run: |
          git config --global user.email "ci@foro.sh"
          git config --global user.name "foro CI"

      - name: Run pytest
        # pipefail so tee doesn't mask pytest's exit code.
        run: |
          set -o pipefail
          uv run --frozen pytest -q --tb=short | tee pytest-output.txt
        working-directory: packages/python

      # Republish pytest's own summary lines as annotations, so a failure is
      # legible from the PR (and the API) without opening the raw log.
      - name: Annotate failures
        if: failure()
        run: |
          grep -E '^(FAILED|ERROR) ' pytest-output.txt | while IFS= read -r line; do
            echo "::error::$line"
          done
          {
            echo '### Failing tests'
            echo '```'
            grep -E '^(FAILED|ERROR) ' pytest-output.txt || echo 'no FAILED/ERROR lines - pytest failed before collection'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: packages/python

  typescript:
    name: TypeScript tests (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The floor `engines` declares, and the version the publish workflow
        # runs on. node:test differs enough between them to matter: on 22+
        # `node --test <dir>` exits 0 even with a failing test, and glob
        # arguments only work from 22. Testing one version hid both.
        node-version: [18, 22]
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
        with:
          persist-credentials: false

      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
        working-directory: packages/typescript

      # `test` runs the compiled output, so the build is a prerequisite rather
      # than an extra check - there is nothing in dist/ to test without it.
      - run: npm run build
        working-directory: packages/typescript

      # A test command that matches nothing exits 0 and reads exactly like a
      # passing run. This catches that one case - a zero count - and nothing
      # subtler: `node --test <dir>` on 22+ reports "pass 1" for a directory
      # it never really descended into, which looks fine here. The version
      # matrix above is what catches that one.
      - name: Run tests and confirm they were not vacuous
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
          grep -qE '^(# |ℹ )pass [1-9]' test-output.txt \
            || { echo "::error::npm test reported no passing tests"; exit 1; }
        working-directory: packages/typescript
