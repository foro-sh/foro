name: Tests

# No `push` trigger on purpose: semantic-release.yml calls this workflow and
# gates the release on it, so a push-triggered copy would only duplicate CI
# without being able to stop a publish.
on:
  pull_request:
  workflow_call:

# Cancel superseded PR runs, never release-gating ones - `github.event_name`
# is the caller's event, so a merge to main reads as `push` here.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # PR-only: the reusable call from semantic-release.yml is a `push`, and
  # those commits were already linted on their own PRs. `github.event_name`
  # is the caller's event, so this stays skipped on a release-gating run.
  commitlint:
    name: Lint commit messages
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Lint PR commits
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  # release-please bumps the manifest on the first Release PR commit; stamp
  # then rewrites the SDK versions. Until that second commit, Tests would
  # otherwise go green (lockfiles still match the *old* versions) and a
  # merge would tag vX with vX-1 in the packages. This job fails that HEAD.
  # It also runs on the publish-gating call (caller's event is `push`, not
  # `workflow_call`) so an unstamped merge still cannot upload. Regular
  # PRs keep all three versions in lockstep, so the check is a no-op there.
  release-versions:
    name: Release versions match
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Manifest and SDK versions must agree
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import sys

          manifest = json.loads(
              pathlib.Path(".release-please-manifest.json").read_text()
          )["."]
          typescript = json.loads(
              pathlib.Path("packages/typescript/package.json").read_text()
          )["version"]
          pyproject = pathlib.Path("packages/python/pyproject.toml").read_text()
          match = re.search(r'(?m)^version = "([^"]*)"$', pyproject)
          if match is None:
              sys.exit("packages/python/pyproject.toml: no top-level version")
          python = match.group(1)

          print(f"manifest={manifest} python={python} typescript={typescript}")
          if not (manifest == python == typescript):
              sys.exit(
                  "release versions disagree; wait for stamp-release.yml "
                  "to rewrite the SDK manifests"
              )
          PY

  skills:
    name: Plugin skills are not stale
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: scripts/check-skills.sh

  python:
    name: Python tests (${{ matrix.python-version }})
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    # The suite starts real servers and waits on ports, so a hang is
    # plausible. Fail in minutes, not the six-hour default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Floor and ceiling of `requires-python`. Testing only 3.12 is how
        # BaseExceptionGroup shipped as a NameError on every 3.10 handshake.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No setup-python: actions/python-versions ships no linux-arm64 build for
      # 3.10, so on the arm runners uv fetches the interpreter itself.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # `foro check` rejects a repo whose uv.lock has drifted from its
      # pyproject.toml, so this SDK should hold itself to it. --frozen also
      # keeps the run honest: without it uv would quietly relock and the
      # tests would pass against dependencies nobody committed.
      - name: Install locked dependencies
        # Step-scoped on purpose: this picks the interpreter the matrix leg
        # is for (without it uv picks its own and the matrix collapses), but
        # the scaffolding tests shell out to `uv lock` inside generated
        # projects that require >=3.12, and a job-level UV_PYTHON would
        # follow them in and fail the 3.10 leg.
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: uv sync --frozen --dev
        working-directory: packages/python

      # git init runs during scaffolding tests, and git refuses to work
      # without an identity on some runner images.
      - name: Configure git identity for scaffolding tests
        run: |
          git config --global user.email "ci@foro.sh"
          git config --global user.name "foro CI"

      - name: Run pytest
        # pipefail so tee doesn't mask pytest's exit code.
        run: |
          set -o pipefail
          uv run --frozen pytest -q --tb=short | tee pytest-output.txt
        working-directory: packages/python

      # Republish pytest's own summary lines as annotations, so a failure is
      # legible from the PR (and the API) without opening the raw log.
      - name: Annotate failures
        if: failure()
        run: |
          grep -E '^(FAILED|ERROR) ' pytest-output.txt | while IFS= read -r line; do
            echo "::error::$line"
          done
          {
            echo '### Failing tests'
            echo '```'
            grep -E '^(FAILED|ERROR) ' pytest-output.txt || echo 'no FAILED/ERROR lines - pytest failed before collection'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: packages/python

  typescript:
    name: TypeScript tests (node ${{ matrix.node-version }})
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Floor `engines` declares, plus the version publishing runs on.
        # node:test differs between them: globs need 22, and `--test <dir>`
        # exits 0 on 22+ even when a test fails.
        node-version: [18, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
        working-directory: packages/typescript

      # `test` runs the compiled output, so the build is a prerequisite.
      - run: npm run build
        working-directory: packages/typescript

      # A test command matching nothing exits 0 and reads like a passing run.
      # Catches a zero count only; the version matrix covers the subtler case.
      - name: Run tests and confirm they were not vacuous
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
          grep -qE '^(# |ℹ )pass [1-9]' test-output.txt \
            || { echo "::error::npm test reported no passing tests"; exit 1; }
        working-directory: packages/typescript
