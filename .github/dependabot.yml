version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    # The conventionalcommits preset is here only because semantic-release
    # renders release notes with it, and @semantic-release/release-notes-generator
    # pins conventional-changelog-writer <9. Preset 10 requires writer 9 and
    # dies with `Missing helper`, which is what broke every release from Sept 2
    # until #97. It becomes bumpable when semantic-release ships a newer writer.
    ignore:
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /packages/typescript
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /packages/python
    schedule:
      interval: weekly
    groups:
      uv:
        patterns: ["*"]
    # mcp 2.0 changes the streamable-HTTP client `foro dev` handshakes with -
    # its context manager yields two values where 1.x yields three - so a major
    # bump is a code change in dev.py, not a lockfile bump. Dependabot widened
    # the `<2.0` bound to `<3.0` once already and broke the suite; taking that
    # PR again should be a deliberate act.
    # fastmcp majors are the same bound from the other side: fastmcp 4 requires
    # mcp>=2.0, so the bump cannot resolve and the whole group errors out.
    ignore:
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
      - dependency-name: fastmcp
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
