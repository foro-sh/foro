[project]
name = "foro"
version = "0.8.0"
description = "Python SDK for Foro"
readme = "README.md"
requires-python = ">=3.10"
# The CLI's deps live here rather than behind an extra so `uvx foro init`
# works as documented - an extra would force `uvx 'foro[cli]' init` on every
# user just to run the tool. The cost this buys back is small: a deployed
# server already depends on fastmcp, whose tree carries pyyaml, mcp, anyio
# and python-dotenv (plus click and rich), so the incremental container
# footprint is typer, shellingham and annotated-doc - three pure-Python
# wheels. If that ever stops being true, the escape hatch is splitting the
# dependency-free runtime shim into its own distribution rather than
# re-hiding the CLI behind an extra.
dependencies = [
  "typer>=0.15",
  "pyyaml>=6.0",
  # Upper bound is load-bearing, not caution. `foro dev`'s handshake uses
  # mcp's streamable-HTTP client, whose context manager yields
  # (read, write, get_session_id) through 1.x and two values in 2.0 - so an
  # unbounded range breaks `uvx foro dev`, which resolves fresh and has no
  # fastmcp to hold mcp down. The range matches fastmcp's own
  # (`mcp<2.0,>=1.24.0`) on purpose: foro is a runtime dependency of every
  # scaffolded project alongside fastmcp, and a wider or forward range there
  # is an unresolvable conflict rather than a bug. Moving to 2.x means
  # updating the unpack in dev.py and this bound together, once fastmcp goes.
  "mcp>=1.24,<2.0",
  "anyio>=4.0",
  "python-dotenv>=1.0",
]
authors = [{ name = "Foro" }]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
# Kept as an empty alias so the `foro[cli]` spelling that shipped in earlier
# docs keeps resolving instead of erroring on an unknown extra. Everything it
# used to pull in is now a base dependency.
cli = []

[project.scripts]
foro = "foro.cli:app"

[project.urls]
Homepage = "https://github.com/foro-sh/foro"
Repository = "https://github.com/foro-sh/foro"
Issues = "https://github.com/foro-sh/foro/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foro"]

[dependency-groups]
# Everything the CLI needs is a base dependency now, so this only adds the
# test runner on top. PEP 735 spelling, matching what `foro init` scaffolds
# into a generated project - `[tool.uv] dev-dependencies` is deprecated.
# fastmcp is here rather than in dependencies because `foro.bridge()` imports
# it lazily, inside the call - the runtime shim stays dependency-light, and a
# deployed server brings its own fastmcp anyway.
dev = ["pytest>=8.0", "fastmcp>=2.0"]
