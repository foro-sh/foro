[project]
name = "foro"
version = "0.2.0"
description = "Python SDK for Foro"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "Foro" }]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
# The runtime shim (foro.run / foro.secret, foro-sh/foro#3) stays dependency-free
# so a deployed container never pulls in CLI tooling it doesn't use - only
# `uv sync`ing this extra (e.g. `uvx 'foro[cli]'`) installs typer.
cli = ["typer>=0.15", "pyyaml>=6.0", "mcp>=1.0", "anyio>=4.0", "python-dotenv>=1.0"]

[project.scripts]
foro = "foro.cli:app"

[project.urls]
Homepage = "https://github.com/foro-sh/foro"
Repository = "https://github.com/foro-sh/foro"
Issues = "https://github.com/foro-sh/foro/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foro"]

[tool.uv]
dev-dependencies = ["pytest>=8.0", "typer>=0.15", "pyyaml>=6.0", "mcp>=1.0", "anyio>=4.0", "python-dotenv>=1.0"]
